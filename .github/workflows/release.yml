name: Release

# A release is cut by pushing a version tag:
#   git tag v1.0.3 && git push origin v1.0.3
# The tag decides versionName (1.0.3) and versionCode (10003). Nothing is committed back.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in SIGNING_KEY ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. A release must be signed."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fetch game database
        env:
          DB_URL: ${{ vars.DATSTATION_DB_URL }}
          DB_TOKEN: ${{ secrets.DATSTATION_DB_TOKEN }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Repository variable DATSTATION_DB_URL is not set (see DEVELOPMENT.md)."
            exit 1
          fi
          auth=()
          if [ -n "$DB_TOKEN" ]; then auth=(-H "Authorization: Bearer $DB_TOKEN"); fi
          mkdir -p app/src/main/assets
          curl -fsSL "${auth[@]}" -o app/src/main/assets/datstation.db "$DB_URL"
          ls -l app/src/main/assets/datstation.db

      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $version (versionCode $code)"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Decode keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          DATSTATION_KEYSTORE: ${{ runner.temp }}/release.jks
          DATSTATION_KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          DATSTATION_KEY_ALIAS: ${{ secrets.ALIAS }}
          DATSTATION_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pdatstation.versionName=${{ steps.version.outputs.name }} \
            -Pdatstation.versionCode=${{ steps.version.outputs.code }}
          mv app/build/outputs/apk/release/datstation-release.apk \
             "app/build/outputs/apk/release/datstation-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: datstation-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/datstation-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: DatStation ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/datstation-${{ steps.version.outputs.name }}.apk
